<!DOCTYPE html>
<html>
<body style="background:#0f172a;color:#fff;font-family:sans-serif;text-align:center;padding:40px;">
  <h2>AI Thumbnail Studio - Icon & Splash Generator</h2>
  <p>Niche diye gaye buttons par click karke dono PNG files apne <b>assets</b> folder mein save karein:</p>
  <button onclick="downloadCanvas('icon', 1024, 'icon-only.png')" style="padding:14px 24px;font-size:16px;background:#ef4444;color:#fff;border:none;border-radius:8px;cursor:pointer;margin:10px;">Download icon-only.png (1024x1024)</button>
  <button onclick="downloadCanvas('splash', 2732, 'splash.png')" style="padding:14px 24px;font-size:16px;background:#3b82f6;color:#fff;border:none;border-radius:8px;cursor:pointer;margin:10px;">Download splash.png (2732x2732)</button>
  <br><br>
  <canvas id="c" width="512" height="512" style="border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,0.5);"></canvas>

  <script>
    function drawLogo(canvas, size, isSplash) {
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      // Background
      const bg = ctx.createLinearGradient(0, 0, size, size);
      bg.addColorStop(0, '#0f172a');
      bg.addColorStop(1, '#1e1b4b');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, size, size);

      const scale = isSplash ? 0.35 : 0.72;
      const box = size * scale;
      const x = (size - box) / 2;
      const y = (size - box) / 2;
      const r = box * 0.22;

      // Red-Orange YouTube Thumbnail Card
      const grad = ctx.createLinearGradient(x, y, x + box, y + box);
      grad.addColorStop(0, '#ef4444');
      grad.addColorStop(1, '#f97316');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.roundRect(x, y, box, box, r);
      ctx.fill();

      // White Play Triangle
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      const px = size / 2 - box * 0.12;
      const py = size / 2 - box * 0.18;
      ctx.moveTo(px, py);
      ctx.lineTo(px, py + box * 0.36);
      ctx.lineTo(px + box * 0.30, py + box * 0.18);
      ctx.closePath();
      ctx.fill();

      // AI Sparkle Badge
      ctx.fillStyle = '#facc15';
      ctx.beginPath();
      ctx.arc(x + box * 0.80, y + box * 0.22, box * 0.11, 0, Math.PI * 2);
      ctx.fill();
    }

    drawLogo(document.getElementById('c'), 512, false);

    function downloadCanvas(type, size, filename) {
      const temp = document.createElement('canvas');
      drawLogo(temp, size, type === 'splash');
      const a = document.createElement('a');
      a.download = filename;
      a.href = temp.toDataURL('image/png');
      a.click();
    }
  </script>
</body>
</html>
